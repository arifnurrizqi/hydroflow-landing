name: hydroflow-landing-cms
services:
  cms:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CMS_PORT:-8091}:8000"
    env_file: .env
    volumes:
      - cms_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 384m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  cms_data:
